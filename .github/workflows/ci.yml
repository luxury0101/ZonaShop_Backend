name: Backend CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-clave-segura-solo-para-pruebas
      DJANGO_DEBUG: "False"
      DATABASE_URL: sqlite:///ci.sqlite3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python manage.py test --settings=config.test_settings
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --validate --file schema.yml
